<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1e88e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="時間割">
  <title>時間割</title>

  <!-- PWA Manifest Data URI -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"時間割","short_name":"時間割","description":"時間割アプリ","start_url":".","display":"standalone","background_color":"#ffffff","theme_color":"#1e88e5","icons":[{"src":"data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"512\" height=\"512\" viewBox=\"0 0 512 512\"><rect width=\"512\" height=\"512\" rx=\"100\" fill=\"%231e88e5\"/><text x=\"50%\" y=\"55%\" dominant-baseline=\"middle\" text-anchor=\"middle\" fill=\"white\" font-size=\"180\" font-weight=\"bold\" font-family=\"sans-serif\">時間割</text></svg>","sizes":"512x512","type":"image/svg+xml"}]}'>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .redirect-container {
      text-align: center;
      padding: 24px;
    }

    .status-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 16px;
    }

    .status-text {
      font-size: 20px;
      font-weight: 600;
      color: #333333;
      letter-spacing: 1px;
    }

    .dots {
      position: absolute;
      left: 100%;
      top: 0;
      font-size: 20px;
      font-weight: 600;
      color: #333333;
      white-space: nowrap;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e0e0e0;
      border-top: 3px solid #1e88e5;
      border-radius: 50%;
      margin: 0 auto;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Ctrl + Shift + 1 ソース表示モーダル */
    #source-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      color: #00ff66;
      font-family: monospace;
      padding: 20px;
      box-sizing: border-box;
      flex-direction: column;
    }
    #source-modal header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: transparent;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }
    #source-content {
      flex: 1;
      width: 100%;
      background-color: #121212;
      color: #00ff66;
      border: 1px solid #333;
      padding: 12px;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-all;
      overflow-y: auto;
      border-radius: 4px;
    }
    .close-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
    }
  </style>
</head>
<body>

  <div class="redirect-container">
    <div class="status-wrapper">
      <span class="status-text">リダイレクト中</span>
      <span id="dots" class="dots"></span>
    </div>
    <div class="spinner"></div>
  </div>

  <!-- 全ソースコード表示モーダル (Ctrl + Shift + 1) -->
  <div id="source-modal">
    <header>
      <h2 style="font-size: 16px; color: #fff;">ソースコードビューア (Ctrl+Shift+1)</h2>
      <button class="close-btn" id="close-modal-btn">✕</button>
    </header>
    <textarea id="source-content" readonly></textarea>
  </div>

  <script>
    const targetUrl = 'https://sites.google.com/view/osdatabase-2427/timetable';
    const dotsElem = document.getElementById('dots');
    const sourceModal = document.getElementById('source-modal');
    const sourceContent = document.getElementById('source-content');
    const closeModalBtn = document.getElementById('close-modal-btn');

    // 「リダイレクト中」の位置を固定し、右側のドットのみ変化させるアニメーション
    const dotStates = ['', '.', '..', '...'];
    let currentStateIndex = 0;

    setInterval(() => {
      currentStateIndex = (currentStateIndex + 1) % dotStates.length;
      dotsElem.textContent = dotStates[currentStateIndex];
    }, 400);

    // osdatabase への自動リダイレクト実行
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        window.location.replace(targetUrl);
      }, 300);
    });

    // キーボードショートカット: Ctrl + Shift + 1 でソース表示
    window.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.shiftKey && (e.key === '1' || e.code === 'Digit1')) {
        e.preventDefault();
        toggleSourceModal();
      }
    });

    function toggleSourceModal() {
      if (sourceModal.style.display === 'flex') {
        sourceModal.style.display = 'none';
      } else {
        sourceContent.value = document.documentElement.outerHTML;
        sourceModal.style.display = 'flex';
      }
    }

    closeModalBtn.addEventListener('click', () => {
      sourceModal.style.display = 'none';
    });

    // インライン Service Worker (PWA動作安定化用)
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', (e) => self.skipWaiting());
        self.addEventListener('activate', (e) => self.clients.claim());
        self.addEventListener('fetch', (e) => {});
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl).catch(() => {});
    }
  </script>
</body>
</html>
